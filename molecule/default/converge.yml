---
- name: Converge
  hosts: all

  pre_tasks:
    - name: Update apt cache.
      apt: update_cache=true cache_valid_time=600
      changed_when: false
      when: ansible_os_family == 'Debian'

  roles:
    - role: carlosroman.base_role

  post_tasks:
    - name: Debug
      ansible.builtin.debug:
        msg: "Add you verify tasks here."
